<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Residue Contact Graph Viewer</title>

  <style>
    body {
      margin: 0;
      background: #ffffff;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #111;
    }

    .viewer-wrap {
        display: grid;
        grid-template-columns: 1fr 250px;
        gap: 18px;
        width: 100%;
        height: 620px;
        box-sizing: border-box;
        padding: 18px;
        border: 1px solid #e4e4e4;
        background: #ffffff;
        overflow: hidden;
        align-items: stretch;
    }

    canvas {
        width: 100%;
        height: 100%;
        border: 1px solid #eeeeee;
        background: #ffffff;
        cursor: grab;
        display: block;
        box-sizing: border-box;
    }

    canvas:active {
      cursor: grabbing;
    }

    .panel {
      border-left: 1px solid #eeeeee;
      padding-left: 18px;
      font-size: 14px;
      line-height: 1.45;
    }

    .panel h3 {
      margin: 0 0 10px;
      font-size: 18px;
      line-height: 1.2;
    }

    .panel p {
      margin: 0 0 12px;
      font-size: 14px;
      line-height: 1.45;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 7px 0;
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      display: inline-block;
    }

    .controls {
      margin-top: 18px;
    }

    label {
      display: block;
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      font-weight: 700;
    }

    input[type="range"] {
      width: 100%;
    }

    button {
      margin-top: 12px;
      border: 1px solid #ddd;
      background: #fafafa;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
    }

    button:hover {
      background: #f0f0f0;
    }

    .small {
      color: #666;
      font-size: 12px;
      margin-top: 12px;
    }
  </style>
</head>

  <div class="viewer-wrap">
    <canvas id="viewer"></canvas>

      <div class="legend-row"><span class="dot" style="background:#ffb000;"></span> Contacting residues</div>
      <div class="legend-row"><span class="dot" style="background:#3f7fbf;"></span> Other residues</div>
      <div class="legend-row"><span style="width:20px;height:2px;background:#d0d0d0;display:inline-block;"></span> Cα contact edge</div>

      <div class="controls">
        <label for="zoom">Zoom</label>
        <input id="zoom" type="range" min="45" max="180" value="95">
        <button id="reset">Reset view</button>
      </div>

      <p class="small">
        Drag to rotate. This is a lightweight local visualization of the Cα contact network used to motivate graph-based modeling.
      </p>
    </aside>
  </div>

    const chainId = "A";

    const canvas = document.getElementById("viewer");
    const ctx = canvas.getContext("2d");
    const zoomSlider = document.getElementById("zoom");
    const resetButton = document.getElementById("reset");

    let rotX = -0.45;
    let rotY = 0.65;
    let dragging = false;
    let lastX = 0;
    let lastY = 0;

    function parseCAAtoms(pdb) {
      const atoms = [];
      const lines = pdb.split("\n");

      for (const line of lines) {
        if (!line.startsWith("ATOM")) continue;

        const atomName = line.slice(12, 16).trim();
        const chain = line.slice(21, 22).trim();
        if (atomName !== "CA") continue;
        if (chain !== chainId) continue;

        const resName = line.slice(17, 20).trim();
        const resSeq = parseInt(line.slice(22, 26).trim(), 10);
        const x = parseFloat(line.slice(30, 38));
        const y = parseFloat(line.slice(38, 46));
        const z = parseFloat(line.slice(46, 54));

        if (!Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(z)) continue;

        atoms.push({resName, resSeq, x, y, z});
      }

      return atoms;
    }

    function centerAtoms(atoms) {
      const cx = atoms.reduce((s, a) => s + a.x, 0) / atoms.length;
      const cy = atoms.reduce((s, a) => s + a.y, 0) / atoms.length;
      const cz = atoms.reduce((s, a) => s + a.z, 0) / atoms.length;

      return atoms.map(a => ({
        ...a,
        x: a.x - cx,
        y: a.y - cy,
        z: a.z - cz
      }));
    }

    function dist(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      const dz = a.z - b.z;
      return Math.sqrt(dx * dx + dy * dy + dz * dz);
    }

    function buildEdges(atoms) {
      const edges = [];
      const neighborSet = new Set();

      for (let i = 0; i < atoms.length; i++) {
        for (let j = i + 1; j < atoms.length; j++) {
          const d = dist(atoms[i], atoms[j]);
          if (d <= contactCutoff) {
            edges.push([i, j]);
            if (atoms[i].resSeq === mutationResseq) neighborSet.add(j);
            if (atoms[j].resSeq === mutationResseq) neighborSet.add(i);
          }
        }
      }

      return {edges, neighborSet};
    }

      const cosY = Math.cos(rotY);
      const sinY = Math.sin(rotY);
      const cosX = Math.cos(rotX);
      const sinX = Math.sin(rotX);

      let x = p.x * cosY + p.z * sinY;
      let z = -p.x * sinY + p.z * cosY;
      let y = p.y;

      let y2 = y * cosX - z * sinX;
      let z2 = y * sinX + z * cosX;

      return {x, y: y2, z: z2};
    }

    let atoms = centerAtoms(parseCAAtoms(pdbText));

    function resizeCanvas() {

      canvas.height = rect.height * window.devicePixelRatio;
      ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);

    function draw() {
      resizeCanvas();

      const rect = canvas.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;
      const scale = parseFloat(zoomSlider.value);

      ctx.clearRect(0, 0, width, height);

      const projected = atoms.map((a, idx) => {
        const r = rotatePoint(a);
        return {
          ...a,
          idx,
          sx: width / 2 + r.x * scale / 18,
          sy: height / 2 - r.y * scale / 18,
          depth: r.z

      });

      ctx.lineWidth = 1.2;
      ctx.strokeStyle = "rgba(190, 190, 190, 0.42)";

      for (const [i, j] of graph.edges) {
        const a = projected[i];
        const b = projected[j];
        ctx.beginPath();
        ctx.moveTo(a.sx, a.sy);
        ctx.lineTo(b.sx, b.sy);
        ctx.stroke();
      }

      const sorted = projected.slice().sort((a, b) => a.depth - b.depth);

      for (const a of sorted) {
        const isMutation = a.resSeq === mutationResseq;
        const isNeighbor = graph.neighborSet.has(a.idx);

        let radius = 5.5;
        let fill = "rgba(63, 127, 191, 0.72)";
        let stroke = "rgba(30, 80, 130, 0.95)";
        let lineWidth = 1.6;

        if (isNeighbor) {
          radius = 7;
          fill = "rgba(255, 176, 0, 0.85)";
          stroke = "rgba(175, 115, 0, 1)";
          lineWidth = 2.0;
        }

        if (isMutation) {
          radius = 10;
          fill = "rgba(178, 34, 34, 0.95)";
          stroke = "rgba(120, 0, 0, 1)";
          lineWidth = 3.0;
        }

        ctx.beginPath();
        ctx.arc(a.sx, a.sy, radius, 0, 2 * Math.PI);
        ctx.fillStyle = fill;
        ctx.fill();
        ctx.strokeStyle = stroke;
        ctx.lineWidth = lineWidth;
        ctx.stroke();

        if (isMutation) {
          ctx.fillStyle = "#111";
          ctx.font = "bold 14px Helvetica Neue, Arial, sans-serif";
          ctx.fillText("Y80F", a.sx + 13, a.sy - 13);
        }
      }

      ctx.fillStyle = "#666";
      ctx.font = "13px Helvetica Neue, Arial, sans-serif";
      ctx.fillText(`${atoms.length} Cα residues · ${graph.edges.length} contact edges`, 16, height - 18);
    }
